<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SITM-MIO Monitoring</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>window.L_DISABLE_3D = true;</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { overflow: hidden; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var MAP_HTML_VERSION = "V3_EXACT_V2_VISUAL_COPY_20260606";
        var CALI_CENTER = [3.4516, -76.5320];
        var CALI_ZOOM = 12;
        var BATCH_SIZE = 80;
        var map = null;
        var markers = {};
        var allPoints = [];
        var playbackPoints = [];
        var routeFilter = "__ALL__";
        var playbackIndex = 0;
        window.__busMarkers = window.__busMarkers || {};

        function initializeMap() {
            window.__MAP_HTML_VERSION = MAP_HTML_VERSION;
            if (document && document.body) {
                document.body.setAttribute("data-map-version", MAP_HTML_VERSION);
            }
            console.log("MAP_HTML_VERSION=" + MAP_HTML_VERSION);
            if (map || typeof L === "undefined") {
                return;
            }

            map = L.map("map", {
                zoomControl: true,
                preferCanvas: true,
                zoomAnimation: false,
                fadeAnimation: false,
                markerZoomAnimation: false
            }).setView(CALI_CENTER, CALI_ZOOM);
            window.__map = map;

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OpenStreetMap contributors"
            }).addTo(map);

            fixMapSize();
        }

        function isSitmMapReady() {
            return !!map;
        }

        function fixMapSize() {
            if (window.__map) {
                window.__map.invalidateSize(false);
            }
        }

        function refreshMapSize() {
            fixMapSize();
        }

        function centerOnCali() {
            if (map) {
                map.setView(CALI_CENTER, CALI_ZOOM, { animate: false });
                fixMapSize();
            }
        }

        function loadPoints(pointsJson) {
            try {
                var rawPoints = typeof pointsJson === "string" ? JSON.parse(pointsJson || "[]") : (pointsJson || []);
                allPoints = normalizePoints(rawPoints);
                sortPlaybackPoints(allPoints);
                applyRouteFilter();
                clearMovingMarkers();
                playbackIndex = 0;
                console.log("MAP_HTML_VERSION=" + MAP_HTML_VERSION);
                console.log("Map sample total points=" + allPoints.length);
                console.log("Map sample unique routes=" + uniqueRoutes(allPoints).length);
                if (allPoints.length > 0) {
                    var first = allPoints[0];
                    console.log("First point=visualBusKey=" + first.visualBusKey
                            + ", processingBusId=" + first.processingBusId + ", routeId=" + first.routeId
                            + ", lat=" + first.latitude + ", lon=" + first.longitude
                            + ", timestamp=" + first.timestamp);
                }
            } catch (error) {
                allPoints = [];
                playbackPoints = [];
                playbackIndex = 0;
                clearMovingMarkers();
                console.log("Map loadPoints error=" + error);
            }
        }

        function applyRouteFilter() {
            playbackPoints = [];
            for (var i = 0; i < allPoints.length; i++) {
                if (isRouteVisible(allPoints[i])) {
                    playbackPoints.push(allPoints[i]);
                }
            }
            sortPlaybackPoints(playbackPoints);
        }

        function filterRoute(routeId) {
            routeFilter = (!routeId || routeId === "__ALL__" || routeId === "Todas las rutas") ? "__ALL__" : String(routeId);
            clearMovingMarkers();
            playbackIndex = 0;
            applyRouteFilter();
            console.log("Current route filter=" + routeFilter);
            console.log("Playback points after filter=" + playbackPoints.length);
            return true;
        }

        function updateBus(busId, lat, lng, lineId, time) {
            if (!map || typeof L === "undefined") {
                return false;
            }

            if (markers[busId]) {
                markers[busId].setLatLng([lat, lng]);
                markers[busId].setPopupContent("<b>Bus:</b> " + busId + "<br><b>Ruta:</b> " + lineId + "<br><b>Hora:</b> " + time);
            } else {
                var marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup("<b>Bus:</b> " + busId + "<br><b>Ruta:</b> " + lineId + "<br><b>Hora:</b> " + time);
                markers[busId] = marker;
            }
            return true;
        }

        function updateMovingMarkers(markersJson) {
            if (!window.__map || typeof L === "undefined") {
                return false;
            }

            var updates = typeof markersJson === "string" ? JSON.parse(markersJson || "[]") : (markersJson || []);
            updates.forEach(function (rawMarker) {
                var m = normalizePoint(rawMarker);
                if (!m || !isRouteVisible(m)) {
                    return;
                }
                var markerKey = m.visualBusKey;
                var latlng = [m.latitude, m.longitude];
                var marker = window.__busMarkers[markerKey];
                var markerColor = colorForRoute(m.routeId);
                if (!marker) {
                    marker = L.circleMarker(latlng, {
                        radius: 6,
                        color: markerColor,
                        weight: 2,
                        fillColor: markerColor,
                        fillOpacity: 0.85,
                        interactive: true
                    }).addTo(window.__map);
                    window.__busMarkers[markerKey] = marker;
                } else {
                    marker.setLatLng(latlng);
                    marker.setStyle({
                        color: markerColor,
                        fillColor: markerColor
                    });
                }
                marker.bindPopup(formatPopup(m));
            });
            return true;
        }

        function clearMovingMarkers() {
            if (!window.__map) {
                return;
            }
            Object.keys(window.__busMarkers).forEach(function (busId) {
                window.__map.removeLayer(window.__busMarkers[busId]);
            });
            window.__busMarkers = {};
        }

        function setPlaybackState(message) {
            console.log("Playback state=" + (message || ""));
        }

        function setPlaybackProgress(index, total) {
            playbackIndex = typeof index === "number" ? index : playbackIndex;
            console.log("Playback progress=" + String(playbackIndex || 0) + "/" + String(total || playbackPoints.length || 0));
        }

        function resetPlayback() {
            clearMovingMarkers();
            playbackIndex = 0;
            return true;
        }

        function play() {
            return true;
        }

        function pause() {
            return true;
        }

        function reset() {
            return resetPlayback();
        }

        function clearMap() {
            clearMovingMarkers();
            allPoints = [];
            playbackPoints = [];
            playbackIndex = 0;
            return true;
        }

        function normalizePoints(points) {
            var normalized = [];
            if (!points) {
                return normalized;
            }
            for (var i = 0; i < points.length; i++) {
                var point = normalizePoint(points[i]);
                if (point) {
                    normalized.push(point);
                }
            }
            return normalized;
        }

        function normalizePoint(point) {
            if (!point) {
                return null;
            }
            var lat = Number(point.latitude);
            var lon = Number(point.longitude);
            var route = String(point.routeId || point.routeLabel || "").trim();
            var processingBusId = String(point.processingBusId || point.busId || "").trim();
            var visualBusKey = String(point.visualBusKey || point.busCode || point.busId || "").trim();
            if (!visualBusKey || !processingBusId || !route || route === "-1" || !isFinite(lat) || !isFinite(lon)) {
                return null;
            }
            return {
                busId: processingBusId,
                processingBusId: processingBusId,
                visualBusKey: visualBusKey,
                routeId: route,
                routeLabel: String(point.routeLabel || route).trim(),
                timestamp: String(point.timestamp || "").trim(),
                sequence: Number(point.sequence || 0),
                latitude: lat,
                longitude: lon,
                averageSpeedText: String(point.averageSpeedText || point.averageSpeed || point.speedKmh || "").trim(),
                popupText: point.popupText || ""
            };
        }

        function sortPlaybackPoints(points) {
            points.sort(function (left, right) {
                var leftSequence = Number(left.sequence || 0);
                var rightSequence = Number(right.sequence || 0);
                if (leftSequence !== rightSequence) {
                    return leftSequence - rightSequence;
                }
                return String(left.timestamp || "").localeCompare(String(right.timestamp || ""));
            });
        }

        function isRouteVisible(point) {
            if (routeFilter === "__ALL__") {
                return true;
            }
            return point && String(point.routeId || point.routeLabel || "").trim() === routeFilter;
        }

        function formatPopup(point) {
            if (point.popupText) {
                return point.popupText;
            }
            var average = point.averageSpeedText || "No disponible";
            return "<b>Bus:</b> " + escapeHtml(point.visualBusKey)
                    + "<br><b>Ruta:</b> " + escapeHtml(point.routeLabel || point.routeId)
                    + "<br><b>Velocidad promedio:</b> " + escapeHtml(average)
                    + "<br><b>Hora:</b> " + escapeHtml(point.timestamp || "No disponible");
        }

        function uniqueRoutes(points) {
            var seen = {};
            var routes = [];
            for (var i = 0; i < points.length; i++) {
                var route = String(points[i].routeId || "").trim();
                if (route && !seen[route]) {
                    seen[route] = true;
                    routes.push(route);
                }
            }
            routes.sort();
            return routes;
        }

        function uniqueVisualBusKeys(points) {
            var seen = {};
            var buses = [];
            for (var i = 0; i < points.length; i++) {
                var bus = String(points[i].visualBusKey || "").trim();
                if (bus && !seen[bus]) {
                    seen[bus] = true;
                    buses.push(bus);
                }
            }
            buses.sort();
            return buses;
        }

        function uniqueProcessingBusIds(points) {
            var seen = {};
            var buses = [];
            for (var i = 0; i < points.length; i++) {
                var bus = String(points[i].processingBusId || points[i].busId || "").trim();
                if (bus && !seen[bus]) {
                    seen[bus] = true;
                    buses.push(bus);
                }
            }
            buses.sort();
            return buses;
        }

        function colorForRoute(route) {
            var text = String(route || "default");
            var hash = 0;
            for (var i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash = hash & hash;
            }
            var colors = ["#14b8a6", "#2563eb", "#f59e0b", "#dc2626", "#7c3aed", "#059669", "#db2777"];
            return colors[Math.abs(hash) % colors.length];
        }

        function getMapAuditState() {
            return {
                version: MAP_HTML_VERSION,
                totalPointsLoaded: allPoints.length,
                playbackPoints: playbackPoints.length,
                uniqueBusIds: uniqueVisualBusKeys(playbackPoints).length,
                uniqueVisualBusKeys: uniqueVisualBusKeys(playbackPoints).length,
                uniqueProcessingBusIds: uniqueProcessingBusIds(playbackPoints).length,
                uniqueRouteIds: uniqueRoutes(playbackPoints).length,
                activeMarkers: Object.keys(window.__busMarkers || {}).length,
                playbackIndex: playbackIndex,
                activeTimers: 0,
                batchSize: BATCH_SIZE,
                routeFilter: routeFilter,
                canvasExists: !!document.querySelector("canvas"),
                overlayExists: false,
                popupBound: hasBoundPopup()
            };
        }

        function hasBoundPopup() {
            var keys = Object.keys(window.__busMarkers || {});
            for (var i = 0; i < keys.length; i++) {
                var marker = window.__busMarkers[keys[i]];
                if (marker && (marker.getPopup || marker._popup)) {
                    return true;
                }
            }
            return false;
        }

        function escapeHtml(value) {
            return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
        }

        window.addEventListener("resize", fixMapSize);
        (function () {
            var el = document.getElementById("map");
            if (window.ResizeObserver && el) {
                new ResizeObserver(function () {
                    fixMapSize();
                }).observe(el);
            }
        })();
        initializeMap();
        setTimeout(fixMapSize, 200);
    </script>
</body>
</html>
