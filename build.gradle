allprojects {

    repositories {
        mavenCentral()
    }
}

subprojects {

    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {

        implementation 'com.zeroc:ice:3.7.10'

        implementation 'org.postgresql:postgresql:42.2.27'
    }
}
